<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <title>통계 모듈 리팩토링 — Before / After</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #0a0a0f;
      font-family: 'Inter', sans-serif;
      color: #fff;
    }

    .slide {
      width: 1920px;
      height: 1080px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 52px 80px 40px;
      gap: 0;
      position: relative;
      background: #0a0a0f;
    }

    /* Subtle background grid */
    .slide::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 80px 80px;
      pointer-events: none;
      z-index: 0;
    }

    /* Title */
    .title {
      position: relative;
      z-index: 1;
      text-align: center;
      margin-bottom: 40px;
      opacity: 0;
    }

    .title h1 {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #f0f0f8;
      line-height: 1.15;
    }

    .title h1 span.accent {
      background: linear-gradient(90deg, #ff4d4d, #ff9966);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .title h1 span.accent-green {
      background: linear-gradient(90deg, #4dff91, #00d4aa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .title-sub {
      margin-top: 8px;
      font-size: 16px;
      font-weight: 500;
      color: rgba(255,255,255,0.38);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Panels row */
    .panels {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 32px;
      width: 100%;
      flex: 1;
      min-height: 0;
    }

    /* Individual panel */
    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      min-height: 0;
    }

    .panel-before {
      border: 2px solid rgba(255, 60, 60, 0.55);
      box-shadow:
        0 0 0 1px rgba(255,60,60,0.12),
        0 0 40px rgba(255,60,60,0.10),
        0 24px 64px rgba(0,0,0,0.6);
      transform: translateX(-100vw);
    }

    .panel-after {
      border: 2px solid rgba(0, 220, 130, 0.55);
      box-shadow:
        0 0 0 1px rgba(0,220,130,0.12),
        0 0 40px rgba(0,220,130,0.10),
        0 24px 64px rgba(0,0,0,0.6);
      transform: translateX(100vw);
    }

    /* Panel header label */
    .panel-label {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 22px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
      flex-shrink: 0;
    }

    .panel-before .panel-label {
      background: rgba(255, 60, 60, 0.12);
      color: #ff6b6b;
      border-bottom: 1px solid rgba(255,60,60,0.25);
    }

    .panel-after .panel-label {
      background: rgba(0, 220, 130, 0.10);
      color: #2dff9e;
      border-bottom: 1px solid rgba(0,220,130,0.22);
    }

    .label-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .panel-before .label-dot {
      background: #ff4d4d;
      box-shadow: 0 0 8px rgba(255,77,77,0.8);
    }

    .panel-after .label-dot {
      background: #00dc82;
      box-shadow: 0 0 8px rgba(0,220,130,0.8);
    }

    /* Image container */
    .panel-image {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }

    .panel-before .panel-image {
      background: rgba(255, 40, 40, 0.04);
    }

    .panel-after .panel-image {
      background: rgba(0, 200, 120, 0.04);
    }

    .panel-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: top center;
      display: block;
    }

    /* Color tint overlay */
    .panel-image::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .panel-before .panel-image::after {
      background: linear-gradient(
        135deg,
        rgba(255, 40, 40, 0.07) 0%,
        transparent 60%
      );
    }

    .panel-after .panel-image::after {
      background: linear-gradient(
        135deg,
        rgba(0, 200, 110, 0.07) 0%,
        transparent 60%
      );
    }

    /* Stats row */
    .stats-row {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 0;
      width: 100%;
      margin-top: 22px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.07);
      background: rgba(255,255,255,0.03);
      flex-shrink: 0;
      opacity: 0;
    }

    .stat-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 20px;
      gap: 5px;
      position: relative;
    }

    .stat-item + .stat-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 20%;
      height: 60%;
      width: 1px;
      background: rgba(255,255,255,0.08);
    }

    .stat-arrow {
      flex: 0 0 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: rgba(255,255,255,0.2);
    }

    .stat-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      font-family: 'JetBrains Mono', monospace;
    }

    .stat-value {
      font-size: 17px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      line-height: 1.2;
    }

    .stat-value.bad {
      color: #ff6b6b;
    }

    .stat-value.good {
      color: #2dff9e;
    }

    .stat-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 20px;
      font-family: 'JetBrains Mono', monospace;
    }

    .stat-badge.improvement {
      background: rgba(0,220,130,0.15);
      color: #00dc82;
      border: 1px solid rgba(0,220,130,0.3);
    }

    .stat-badge.warning {
      background: rgba(255,100,60,0.15);
      color: #ff7a50;
      border: 1px solid rgba(255,100,60,0.3);
    }

    /* Divider arrow between panels */
    .panels-divider {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      width: 48px;
      height: 48px;
      background: #0a0a0f;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: rgba(255,255,255,0.35);
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="slide">
    <!-- Title -->
    <div class="title" id="title">
      <h1>통계 모듈 리팩토링 &mdash; <span class="accent">Before</span> / <span class="accent-green">After</span></h1>
      <div class="title-sub">Statistics Module Refactoring · Code Architecture Review</div>
    </div>

    <!-- Side-by-side panels -->
    <div class="panels">
      <!-- Before panel -->
      <div class="panel panel-before" id="panel-before">
        <div class="panel-label">
          <span class="label-dot"></span>
          Before
        </div>
        <div class="panel-image">
          <img src="../../images/before.png" alt="Before refactoring" draggable="false">
        </div>
      </div>

      <!-- Divider -->
      <div class="panels-divider" id="divider">&#8594;</div>

      <!-- After panel -->
      <div class="panel panel-after" id="panel-after">
        <div class="panel-label">
          <span class="label-dot"></span>
          After
        </div>
        <div class="panel-image">
          <img src="../../images/after.png" alt="After refactoring" draggable="false">
        </div>
      </div>
    </div>

    <!-- Stats row -->
    <div class="stats-row" id="stats-row">
      <div class="stat-item">
        <div class="stat-label">파일 구성</div>
        <div class="stat-value bad">단일 파일 1,200줄</div>
        <div class="stat-badge warning">모놀리식</div>
      </div>
      <div class="stat-arrow">&#8594;</div>
      <div class="stat-item">
        <div class="stat-label">파일 구성</div>
        <div class="stat-value good">모듈화 7개 파일</div>
        <div class="stat-badge improvement">관심사 분리</div>
      </div>

      <div class="stat-item">
        <div class="stat-label">평균 함수 길이</div>
        <div class="stat-value bad">~180줄</div>
        <div class="stat-badge warning">재사용 불가</div>
      </div>
      <div class="stat-arrow">&#8594;</div>
      <div class="stat-item">
        <div class="stat-label">평균 함수 길이</div>
        <div class="stat-value good">~25줄</div>
        <div class="stat-badge improvement">단일 책임 원칙</div>
      </div>

      <div class="stat-item">
        <div class="stat-label">테스트 커버리지</div>
        <div class="stat-value bad">0%</div>
        <div class="stat-badge warning">미적용</div>
      </div>
      <div class="stat-arrow">&#8594;</div>
      <div class="stat-item">
        <div class="stat-label">테스트 커버리지</div>
        <div class="stat-value good">87%</div>
        <div class="stat-badge improvement">단위 테스트</div>
      </div>

      <div class="stat-item">
        <div class="stat-label">타입 안전성</div>
        <div class="stat-value bad">any 다수</div>
        <div class="stat-badge warning">런타임 오류 위험</div>
      </div>
      <div class="stat-arrow">&#8594;</div>
      <div class="stat-item">
        <div class="stat-label">타입 안전성</div>
        <div class="stat-value good">완전 타입 지정</div>
        <div class="stat-badge improvement">컴파일 타임 검증</div>
      </div>
    </div>
  </div>

  <script>
    // Wait for fonts + images to settle before animating
    window.addEventListener('load', () => {
      const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });

      // Set initial states
      gsap.set('#panel-before', { x: '-100vw', opacity: 0 });
      gsap.set('#panel-after', { x: '100vw', opacity: 0 });
      gsap.set('#title', { opacity: 0, y: -30 });
      gsap.set('#stats-row', { opacity: 0, y: 24 });
      gsap.set('#divider', { opacity: 0, scale: 0 });

      // Entrance sequence
      tl
        // 1. Title drops in
        .to('#title', {
          opacity: 1,
          y: 0,
          duration: 0.65,
          ease: 'power2.out'
        })
        // 2. Panels slide in from sides simultaneously
        .to('#panel-before', {
          x: 0,
          opacity: 1,
          duration: 0.75,
          ease: 'power3.out'
        }, '+=0.1')
        .to('#panel-after', {
          x: 0,
          opacity: 1,
          duration: 0.75,
          ease: 'power3.out'
        }, '<')
        // 3. Center divider pops in
        .to('#divider', {
          opacity: 1,
          scale: 1,
          duration: 0.35,
          ease: 'back.out(1.7)'
        }, '-=0.2')
        // 4. Stats row slides up
        .to('#stats-row', {
          opacity: 1,
          y: 0,
          duration: 0.55,
          ease: 'power2.out'
        }, '-=0.1');
    });
  </script>
</body>
</html>
