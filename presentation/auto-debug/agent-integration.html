<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Board-Resolver Agent Integration</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
  }

  body {
    overflow: hidden;
    background: #0f172a;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: #f8fafc;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* ---- Title ---- */
  .title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 20px;
    visibility: hidden;
  }
  .title span { color: #3b82f6; }

  /* ---- Hub canvas ---- */
  .hub-canvas {
    position: relative;
    width: 720px;
    height: 520px;
  }

  /* ---- SVG layer (lines + particles) ---- */
  .connections-svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: visible;
  }

  /* Base dim lines */
  .base-line {
    fill: none;
    stroke: #1e3a5f;
    stroke-width: 1.5;
    stroke-dasharray: 5 4;
    opacity: 0;
  }

  /* Active glow lines */
  .glow-line {
    fill: none;
    stroke-width: 2.5;
    stroke-dasharray: 600;
    stroke-dashoffset: 600;
    opacity: 0;
    filter: url(#lineGlow);
  }

  /* Particle dots on lines */
  .particle {
    opacity: 0;
  }

  /* ---- Center node ---- */
  .center-node {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 130px;
    height: 130px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    visibility: hidden;
  }

  .center-ring {
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 2px solid rgba(59,130,246,0.4);
    pointer-events: none;
  }

  .center-ring-outer {
    position: absolute;
    inset: -18px;
    border-radius: 50%;
    border: 1px solid rgba(59,130,246,0.15);
    pointer-events: none;
  }

  .center-bg {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #1e3a6e 0%, #1e293b 60%, #0f1f38 100%);
    border: 2px solid #3b82f6;
    box-shadow: 0 0 24px 6px rgba(59,130,246,0.25), inset 0 1px 0 rgba(255,255,255,0.06);
  }

  .center-icon {
    font-size: 30px;
    line-height: 1;
    position: relative;
    z-index: 1;
    margin-bottom: 4px;
  }

  .center-label {
    font-size: 9px;
    font-weight: 700;
    color: #93c5fd;
    text-align: center;
    letter-spacing: 0.04em;
    position: relative;
    z-index: 1;
    line-height: 1.3;
  }

  /* ---- Spoke nodes ---- */
  .spoke-node {
    position: absolute;
    width: 118px;
    height: 90px;
    background: #1e293b;
    border: 1.5px solid #334155;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    z-index: 5;
    visibility: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }

  .spoke-icon {
    font-size: 22px;
    line-height: 1;
  }

  .spoke-name {
    font-size: 11px;
    font-weight: 700;
    color: #e2e8f0;
    letter-spacing: -0.01em;
  }

  .spoke-sub {
    font-size: 9px;
    color: #64748b;
    font-weight: 500;
  }

  /* ---- Tooltip / action label ---- */
  .action-tooltip {
    position: absolute;
    background: rgba(15,23,42,0.92);
    border: 1px solid rgba(59,130,246,0.4);
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 10px;
    font-weight: 600;
    color: #93c5fd;
    white-space: nowrap;
    z-index: 20;
    pointer-events: none;
    opacity: 0;
    backdrop-filter: blur(4px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }

  /* ---- Step indicator ---- */
  .step-indicator {
    margin-top: 18px;
    font-size: 13px;
    font-weight: 500;
    color: #64748b;
    height: 22px;
    visibility: hidden;
    letter-spacing: 0.01em;
  }
  .step-indicator .si-num { color: #3b82f6; font-weight: 700; }
  .step-indicator .si-name { color: #e2e8f0; font-weight: 600; }

  /* ---- Final success ring ---- */
  .success-ring {
    position: absolute;
    inset: -28px;
    border-radius: 50%;
    border: 2px solid transparent;
    pointer-events: none;
    z-index: 9;
  }
</style>
</head>
<body>

<div class="title">
  <span>Board-Resolver</span> Agent Integration
</div>

<div class="hub-canvas">

  <!-- SVG: connection lines + particles -->
  <svg class="connections-svg" viewBox="0 0 720 520">
    <defs>
      <filter id="lineGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="2.5" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- Base dim lines (center=360,260) -->
    <!-- Mattermost top -->
    <path class="base-line" id="bl-0" d="M360,197 L360,120"/>
    <!-- GitLab top-right -->
    <path class="base-line" id="bl-1" d="M414,218 L548,172"/>
    <!-- Sentry bottom-right -->
    <path class="base-line" id="bl-2" d="M414,296 L548,346"/>
    <!-- ELK bottom-left -->
    <path class="base-line" id="bl-3" d="M306,296 L172,346"/>
    <!-- File System top-left -->
    <path class="base-line" id="bl-4" d="M306,218 L172,172"/>

    <!-- Glow lines (same paths) -->
    <path class="glow-line" id="gl-0" d="M360,197 L360,120" stroke="#6366f1"/>
    <path class="glow-line" id="gl-1" d="M414,218 L548,172" stroke="#f97316"/>
    <path class="glow-line" id="gl-2" d="M414,296 L548,346" stroke="#8b5cf6"/>
    <path class="glow-line" id="gl-3" d="M306,296 L172,346" stroke="#06b6d4"/>
    <path class="glow-line" id="gl-4" d="M306,218 L172,172" stroke="#22c55e"/>

    <!-- Particle dots (one per line, animated along path via cx/cy) -->
    <circle class="particle" id="pt-0" r="4" fill="#6366f1" filter="url(#dotGlow)"/>
    <circle class="particle" id="pt-1" r="4" fill="#f97316" filter="url(#dotGlow)"/>
    <circle class="particle" id="pt-2" r="4" fill="#8b5cf6" filter="url(#dotGlow)"/>
    <circle class="particle" id="pt-3" r="4" fill="#06b6d4" filter="url(#dotGlow)"/>
    <circle class="particle" id="pt-4" r="4" fill="#22c55e" filter="url(#dotGlow)"/>
  </svg>

  <!-- Center: Board-Resolver Agent -->
  <div class="center-node" id="center-node">
    <div class="center-ring-outer"></div>
    <div class="center-ring"></div>
    <div class="center-bg"></div>
    <div class="center-icon">🤖</div>
    <div class="center-label">Board-Resolver<br>Agent</div>
    <div class="success-ring" id="success-ring"></div>
  </div>

  <!-- Spoke nodes (pentagon, top → clockwise) -->
  <!-- Node 0: Mattermost — top center (360, 60) -->
  <div class="spoke-node" id="sn-0" style="left:301px; top:28px;">
    <div class="spoke-icon">💬</div>
    <div class="spoke-name">Mattermost</div>
    <div class="spoke-sub">이슈 수집</div>
  </div>

  <!-- Node 1: GitLab — top right (560, 128) -->
  <div class="spoke-node" id="sn-1" style="left:491px; top:122px;">
    <div class="spoke-icon">🦊</div>
    <div class="spoke-name">GitLab</div>
    <div class="spoke-sub">코드 분석</div>
  </div>

  <!-- Node 2: Sentry — bottom right (560, 330) -->
  <div class="spoke-node" id="sn-2" style="left:491px; top:306px;">
    <div class="spoke-icon">🐛</div>
    <div class="spoke-name">Sentry</div>
    <div class="spoke-sub">에러 추적</div>
  </div>

  <!-- Node 3: ELK — bottom left (100, 330) -->
  <div class="spoke-node" id="sn-3" style="left:111px; top:306px;">
    <div class="spoke-icon">📊</div>
    <div class="spoke-name">ELK</div>
    <div class="spoke-sub">로그 검색</div>
  </div>

  <!-- Node 4: File System — top left (100, 128) -->
  <div class="spoke-node" id="sn-4" style="left:111px; top:122px;">
    <div class="spoke-icon">📁</div>
    <div class="spoke-name">File System</div>
    <div class="spoke-sub">코드 수정</div>
  </div>

  <!-- Tooltips -->
  <div class="action-tooltip" id="tt-0" style="left:245px; top:8px;">이슈 카드 분석</div>
  <div class="action-tooltip" id="tt-1" style="left:450px; top:90px;">코드베이스 탐색</div>
  <div class="action-tooltip" id="tt-2" style="left:450px; top:374px;">관련 에러 조회</div>
  <div class="action-tooltip" id="tt-3" style="left:60px; top:374px;">로그 패턴 분석</div>
  <div class="action-tooltip" id="tt-4" style="left:18px; top:90px;">수정사항 적용</div>
</div>

<div class="step-indicator" id="step-indicator">
  Step <span class="si-num">1</span> &mdash; <span class="si-name">Mattermost 이슈 수집</span>
</div>

<script>
(function() {
  /* ---- Capture API ---- */
  var CAPTURE_DURATION = 13;
  window.__captureLengthSec = CAPTURE_DURATION;
  window.__animationReady = false;

  /* ---- Step metadata ---- */
  var steps = [
    { num: 1, label: "Mattermost 이슈 수집",   color: "#6366f1" },
    { num: 2, label: "GitLab 코드 분석",        color: "#f97316" },
    { num: 3, label: "Sentry 에러 추적",         color: "#8b5cf6" },
    { num: 4, label: "ELK 로그 검색",           color: "#06b6d4" },
    { num: 5, label: "File System 코드 수정",   color: "#22c55e" }
  ];

  /* ---- Particle endpoints (from center toward each node) ---- */
  // Each line: from center connector point → node connector point
  var lineEndpoints = [
    { x1:360, y1:197, x2:360, y2:120 },  // 0 Mattermost
    { x1:414, y1:218, x2:548, y2:172 },  // 1 GitLab
    { x1:414, y1:296, x2:548, y2:346 },  // 2 Sentry
    { x1:306, y1:296, x2:172, y2:346 },  // 3 ELK
    { x1:306, y1:218, x2:172, y2:172 }   // 4 File System
  ];

  /* ---- Node glow colors ---- */
  var nodeColors = ["#6366f1","#f97316","#8b5cf6","#06b6d4","#22c55e"];

  /* ---- Initial states ---- */
  gsap.set(".title", { autoAlpha: 0, y: -10 });
  gsap.set("#center-node", { autoAlpha: 0, scale: 0.6 });
  gsap.set(".spoke-node", { autoAlpha: 0, scale: 0.7 });
  gsap.set(".base-line", { opacity: 0 });
  gsap.set(".glow-line", { opacity: 0, strokeDashoffset: 600 });
  gsap.set(".particle", { opacity: 0 });
  gsap.set(".action-tooltip", { opacity: 0, y: 6 });
  gsap.set("#step-indicator", { autoAlpha: 0 });
  gsap.set("#success-ring", { opacity: 0, scale: 1 });

  /* ---- Helpers ---- */
  function setStep(tl, idx, pos) {
    tl.call(function() {
      document.querySelector(".si-num").textContent = steps[idx].num;
      document.querySelector(".si-name").textContent = steps[idx].label;
    }, null, pos);
  }

  function activateNode(tl, idx, pos) {
    var sel = "#sn-" + idx;
    var color = nodeColors[idx];
    tl.to(sel, {
      boxShadow: "0 0 28px 8px " + hexAlpha(color, 0.35) + ", 0 0 0 1px " + color,
      borderColor: color,
      scale: 1.06,
      duration: 0.35,
      ease: "power2.out"
    }, pos);
  }

  function deactivateNode(tl, idx, pos) {
    tl.to("#sn-" + idx, {
      boxShadow: "0 0 8px 2px " + hexAlpha(nodeColors[idx], 0.12),
      borderColor: hexAlpha(nodeColors[idx], 0.35),
      scale: 1,
      duration: 0.3,
      ease: "power2.inOut"
    }, pos);
  }

  function animateGlowLine(tl, idx, pos) {
    var gl = "#gl-" + idx;
    tl.to(gl, { opacity: 1, duration: 0.1 }, pos);
    tl.to(gl, { strokeDashoffset: 0, duration: 0.4, ease: "power2.inOut" }, pos + 0.05);
  }

  function animateParticle(tl, idx, pos) {
    var ep = lineEndpoints[idx];
    var pt = "#pt-" + idx;
    var dur = 0.45;
    var gap = 0.08;
    // Fade in and run 3 passes: center → node, reset, repeat
    tl.set(pt, { attr: { cx: ep.x1, cy: ep.y1 } }, pos);
    tl.to(pt, { opacity: 1, duration: 0.12 }, pos);
    // Pass 1
    tl.to(pt, { attr: { cx: ep.x2, cy: ep.y2 }, duration: dur, ease: "power1.inOut" }, pos + 0.1);
    tl.set(pt, { attr: { cx: ep.x1, cy: ep.y1 } }, pos + 0.1 + dur + gap);
    // Pass 2
    tl.to(pt, { attr: { cx: ep.x2, cy: ep.y2 }, duration: dur, ease: "power1.inOut" }, pos + 0.1 + dur + gap);
    tl.set(pt, { attr: { cx: ep.x1, cy: ep.y1 } }, pos + 0.1 + (dur + gap) * 2);
    // Pass 3
    tl.to(pt, { attr: { cx: ep.x2, cy: ep.y2 }, duration: dur, ease: "power1.inOut" }, pos + 0.1 + (dur + gap) * 2);
    // Fade out after last pass
    tl.to(pt, { opacity: 0, duration: 0.2 }, pos + 0.1 + (dur + gap) * 2 + dur);
  }

  function showTooltip(tl, idx, pos) {
    tl.to("#tt-" + idx, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, pos);
  }

  function hideTooltip(tl, idx, pos) {
    tl.to("#tt-" + idx, { opacity: 0, y: -4, duration: 0.2, ease: "power2.in" }, pos);
  }

  function hexAlpha(hex, alpha) {
    var r = parseInt(hex.slice(1,3),16);
    var g = parseInt(hex.slice(3,5),16);
    var b = parseInt(hex.slice(5,7),16);
    return "rgba("+r+","+g+","+b+","+alpha+")";
  }

  /* ---- Master timeline ---- */
  var tl = gsap.timeline({
    repeat: 0,
    paused: true,
    defaults: { ease: "power2.out" }
  });

  /* ===== INTRO ===== */
  tl.addLabel("intro", 0);
  tl.to(".title", { autoAlpha: 1, y: 0, duration: 0.4 }, "intro");

  // Show center agent first with a pop
  tl.to("#center-node", { autoAlpha: 1, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, "intro+=0.3");

  // Rotating ring on center (CSS keyframe workaround: animate rotation on center-ring)
  tl.to(".center-ring", {
    rotation: 360,
    duration: 8,
    ease: "none",
    repeat: -1,
    transformOrigin: "50% 50%"
  }, "intro+=0.8");

  // Show base lines
  tl.to(".base-line", { opacity: 1, duration: 0.3, stagger: 0.06 }, "intro+=0.7");

  // Pop in spoke nodes with stagger
  tl.to(".spoke-node", {
    autoAlpha: 1,
    scale: 1,
    duration: 0.35,
    stagger: 0.08,
    ease: "back.out(1.6)"
  }, "intro+=0.85");

  // Step indicator appears
  tl.to("#step-indicator", { autoAlpha: 1, duration: 0.3 }, "intro+=1.1");

  /* ===== STEP 1: Mattermost ===== */
  var s1 = 1.6;
  tl.addLabel("step1", s1);
  setStep(tl, 0, "step1");
  animateGlowLine(tl, 0, s1);
  animateParticle(tl, 0, s1 + 0.15);
  activateNode(tl, 0, s1 + 0.1);
  showTooltip(tl, 0, s1 + 0.3);

  /* ===== STEP 2: GitLab ===== */
  var s2 = s1 + 1.8;
  tl.addLabel("step2", s2);
  setStep(tl, 1, "step2");
  hideTooltip(tl, 0, s2 - 0.15);
  deactivateNode(tl, 0, s2);
  animateGlowLine(tl, 1, s2);
  animateParticle(tl, 1, s2 + 0.15);
  activateNode(tl, 1, s2 + 0.1);
  showTooltip(tl, 1, s2 + 0.3);

  /* ===== STEP 3: Sentry ===== */
  var s3 = s2 + 1.8;
  tl.addLabel("step3", s3);
  setStep(tl, 2, "step3");
  hideTooltip(tl, 1, s3 - 0.15);
  deactivateNode(tl, 1, s3);
  animateGlowLine(tl, 2, s3);
  animateParticle(tl, 2, s3 + 0.15);
  activateNode(tl, 2, s3 + 0.1);
  showTooltip(tl, 2, s3 + 0.3);

  /* ===== STEP 4: ELK ===== */
  var s4 = s3 + 1.8;
  tl.addLabel("step4", s4);
  setStep(tl, 3, "step4");
  hideTooltip(tl, 2, s4 - 0.15);
  deactivateNode(tl, 2, s4);
  animateGlowLine(tl, 3, s4);
  animateParticle(tl, 3, s4 + 0.15);
  activateNode(tl, 3, s4 + 0.1);
  showTooltip(tl, 3, s4 + 0.3);

  /* ===== STEP 5: File System ===== */
  var s5 = s4 + 1.8;
  tl.addLabel("step5", s5);
  setStep(tl, 4, "step5");
  hideTooltip(tl, 3, s5 - 0.15);
  deactivateNode(tl, 3, s5);
  animateGlowLine(tl, 4, s5);
  animateParticle(tl, 4, s5 + 0.15);
  activateNode(tl, 4, s5 + 0.1);
  showTooltip(tl, 4, s5 + 0.3);

  /* ===== FINAL: All glow + success ===== */
  var sf = s5 + 1.8;
  tl.addLabel("final", sf);
  hideTooltip(tl, 4, sf - 0.15);

  // All nodes glow simultaneously with their accent colors
  for (var i = 0; i < 5; i++) {
    (function(idx) {
      var color = nodeColors[idx];
      tl.to("#sn-" + idx, {
        boxShadow: "0 0 32px 10px " + hexAlpha(color, 0.4) + ", 0 0 0 1.5px " + color,
        borderColor: color,
        scale: 1.04,
        duration: 0.5,
        ease: "power2.out"
      }, sf);
    })(i);
  }

  // All particles pulse together
  for (var j = 0; j < 5; j++) {
    (function(idx) {
      var ep = lineEndpoints[idx];
      var pt = "#pt-" + idx;
      tl.set(pt, { attr: { cx: ep.x1, cy: ep.y1 }, opacity: 0 }, sf);
      tl.to(pt, { opacity: 1, duration: 0.1 }, sf);
      tl.to(pt, { attr: { cx: ep.x2, cy: ep.y2 }, duration: 0.6, ease: "power1.inOut" }, sf + 0.05);
      tl.to(pt, { opacity: 0, duration: 0.2 }, sf + 0.65);
    })(j);
  }

  // Center pulses green
  tl.to("#center-node .center-bg", {
    boxShadow: "0 0 48px 16px rgba(34,197,94,0.45), inset 0 1px 0 rgba(255,255,255,0.06)",
    borderColor: "#22c55e",
    duration: 0.45,
    ease: "power2.out"
  }, sf + 0.2);

  tl.to("#center-node .center-bg", {
    background: "radial-gradient(circle at 40% 35%, #14532d 0%, #166534 40%, #052e16 100%)",
    duration: 0.45
  }, sf + 0.2);

  // Step indicator → complete
  tl.call(function() {
    document.querySelector(".si-num").textContent = "✓";
    document.querySelector(".si-name").textContent = "해결 완료";
    document.querySelector(".si-num").style.color = "#22c55e";
    document.querySelector(".si-name").style.color = "#4ade80";
  }, null, sf + 0.25);

  /* ===== OUTRO: fade out ===== */
  tl.addLabel("outro", sf + 1.6);
  tl.to([
    ".title", ".spoke-node", "#center-node",
    ".base-line", ".glow-line", ".particle",
    "#step-indicator", ".action-tooltip"
  ], {
    autoAlpha: 0,
    duration: 0.55,
    ease: "power2.inOut"
  }, "outro");

  /* ---- Capture API: expose start function ---- */
  window.startBoardResolverAnimation = function() {
    tl.play();
  };

  /* Auto-play when opened directly in browser (not via capture script) */
  if (!navigator.webdriver) {
    tl.play();
  }

  window.__animationReady = true;
})();
</script>
</body>
</html>
