# NDS Skills 배포 파이프라인
#
# 목적:
# - skills/ 디렉토리를 gabia-skills.zip으로 패키징
# - install.sh, install.ps1, gabia-skills.zip을 Nexus(raw-repository)에 업로드
#
# 사용자 설치 방법:
#   macOS/Linux: curl -fsSL https://repo.gabia.com/repository/raw-repository/nds/install.sh | bash
#   Windows:     irm https://repo.gabia.com/repository/raw-repository/nds/install.ps1 | iex
#
# GitLab CI variables 설정 (Protected/Masked 권장):
#   - NEXUS_USERNAME: Nexus 사용자명
#   - NEXUS_PASSWORD: Nexus 비밀번호
#   - NDS_NEXUS_URL: (선택) Nexus base URL (기본: https://repo.gabia.com/repository/raw-repository/nds)

stages:
  - deploy
  - marketplace

variables:
  NDS_NEXUS_URL: "https://repo.gabia.com/repository/raw-repository/nds"
  NPM_REGISTRY: "https://repo.gabia.com/repository/npm-repository/"

deploy:skills:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - .gitlab-ci.yml
        - skills/**/*
        - skills/manifest.txt
        - install.sh
        - install.ps1
        - requirements.txt
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  image: alpine:latest
  script:
    - set -euo pipefail
    - apk add --no-cache zip curl

    # manifest.txt 자동 생성 (skills/ 하위 디렉토리 목록)
    - echo "=== Generating manifest.txt ==="
    - ls -d skills/*/ | sed 's|skills/||;s|/$||' | sort > skills/manifest.txt
    - echo "Generated manifest.txt with $(wc -l < skills/manifest.txt) skills"
    - cat skills/manifest.txt

    # skills 디렉토리를 zip으로 패키징
    - echo "=== Packaging gabia-skills.zip ==="
    - rm -f gabia-skills.zip
    - cd skills
    - zip -r ../gabia-skills.zip . -x "__pycache__/*" "*.pyc" ".DS_Store" "*.git*"
    - cd ..
    - ls -lh gabia-skills.zip
    - echo "=== Verifying zip contents ==="
    - unzip -l gabia-skills.zip | head -50 || true

    # Nexus에 업로드
    - echo "=== Uploading install.sh ==="
    - curl --fail --silent --show-error -u "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" --upload-file install.sh "${NDS_NEXUS_URL}/install.sh"
    - echo "=== Uploading install.ps1 ==="
    - curl --fail --silent --show-error -u "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" --upload-file install.ps1 "${NDS_NEXUS_URL}/install.ps1"
    - echo "=== Uploading requirements.txt ==="
    - curl --fail --silent --show-error -u "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" --upload-file requirements.txt "${NDS_NEXUS_URL}/requirements.txt"
    - echo "=== Uploading manifest.txt ==="
    - curl --fail --silent --show-error -u "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" --upload-file skills/manifest.txt "${NDS_NEXUS_URL}/manifest.txt"
    - echo "=== Uploading gabia-skills.zip ==="
    - curl --fail --silent --show-error -u "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" --upload-file gabia-skills.zip "${NDS_NEXUS_URL}/gabia-skills.zip"

    - echo "=== Deploy complete ==="
    - 'echo "macOS/Linux: curl -fsSL ${NDS_NEXUS_URL}/install.sh | bash"'
    - 'echo "Windows:     irm ${NDS_NEXUS_URL}/install.ps1 | iex"'

# ===========================================================================
# Claude Code Marketplace: npm 패키지 배포 + marketplace.json 업로드
#
# 사전 준비 (GitLab CI Variables):
#   - NDS_NPM_TOKEN: Nexus npm 레지스트리 인증 토큰
#   - NEXUS_USERNAME / NEXUS_PASSWORD: 기존 Nexus 인증 (deploy:skills 와 공유)
# ===========================================================================
deploy:marketplace:
  stage: marketplace
  needs: ["deploy:skills"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - .gitlab-ci.yml
        - skills/**/*
        - plugins/**/*
        - .claude-plugin/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  image: node:20-alpine
  before_script:
    - apk add --no-cache curl jq zip
  script:
    - set -euo pipefail

    # --- 버전 결정 (태그 → 태그 버전, 그 외 → package.json 버전) ---
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
      else
        VERSION=$(jq -r .version plugins/gabia-skills/package.json)
      fi
      echo "Publishing version: $VERSION"

    # --- 플러그인 디렉토리 준비 (symlink → 실제 파일 복사) ---
    - rm -f plugins/gabia-skills/skills
    - cp -R skills plugins/gabia-skills/skills
    - find plugins/gabia-skills/skills -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
    - find plugins/gabia-skills/skills -name ".DS_Store" -delete 2>/dev/null || true
    - rm -f plugins/gabia-skills/skills/manifest.txt
    - rm -rf plugins/gabia-skills/skills/.claude

    # --- 버전 동기화 ---
    - cd plugins/gabia-skills
    - jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json
    - jq --arg v "$VERSION" '.version = $v' .claude-plugin/plugin.json > tmp.json && mv tmp.json .claude-plugin/plugin.json

    # --- npm 배포 ---
    - echo "//${NPM_REGISTRY#https://}:_authToken=${NDS_NPM_TOKEN}" > .npmrc
    - npm publish --registry "$NPM_REGISTRY"
    - cd "$CI_PROJECT_DIR"

    # --- marketplace.json 버전 동기화 및 Nexus raw repo 업로드 ---
    - jq --arg v "$VERSION" '.plugins[0].version = $v' .claude-plugin/marketplace.json > tmp.json && mv tmp.json .claude-plugin/marketplace.json
    - |
      curl --fail --silent --show-error \
        -u "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" \
        --upload-file .claude-plugin/marketplace.json \
        "${NDS_NEXUS_URL}/marketplace.json"

    - echo ""
    - echo "=== Marketplace published ==="
    - echo "Add:     /plugin marketplace add ${NDS_NEXUS_URL}/marketplace.json"
    - echo "Install: /plugin install gabia-skills@gabia"
